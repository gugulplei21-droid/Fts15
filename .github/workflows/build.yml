name: Construir FTS15 con hook
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Bajar el APK original (Release con tag apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output com_firsttouchgames_fts15.apk
      - name: Instalar apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O "$HOME/apktool.jar"
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$HOME/apktool.jar" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
      - name: Crear archivos del hook
        run: |
          cat > menuhook.cpp <<'MENUHOOK_CPP'
          // menuhook.cpp - ESQUELETO para editar paneles de FTS15 (armeabi-v7a).
          // - Compilar con el NDK, ABI armeabi-v7a, softfp (el valor por defecto; NO usar -mfloat-abi=hard).
          // - Hook propio (sin Dobby). Los simbolos estan en .dynsym, asi que se resuelven con dlsym.
          // - Cargar DESPUES de libFTS15: en el smali de la Activity, tras System.loadLibrary("FTS15"),
          //   anadir System.loadLibrary("menuhook"). Entrada: JNI_OnLoad.
          // - Fase 1: modo LOG (vuelca cada componente a dump.txt). Fase 2: aplica layout.txt.
          #include <jni.h>
          #include <dlfcn.h>
          #include <cxxabi.h>
          #include <typeinfo>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <map>
          #include <string>
          #include <vector>
          #include <android/log.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <stdint.h>
          // Hook propio para ARM de 32 bits (sin librerias externas).
          // El inicio de CFEPanel::AddComponent es "push {r4-r7,fp,lr}; sub sp,sp,#0x18" (e92d48f0 e24dd018):
          // ninguna usa el contador de programa, asi que se pueden copiar tal cual a un trampolin.
          static bool install_hook_arm(void* target, void* hook, void** orig) {
            uint32_t* t = (uint32_t*)target;
            if (((uintptr_t)target & 3) || t[0] != 0xe92d48f0 || t[1] != 0xe24dd018) return false;  // seguridad
            uint32_t* tr = (uint32_t*)mmap(0, 4096, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
            if (tr == (uint32_t*)MAP_FAILED) return false;
            tr[0] = t[0]; tr[1] = t[1];
            tr[2] = 0xe51ff004;                         // ldr pc, [pc, #-4]
            tr[3] = (uint32_t)((uintptr_t)target + 8);  // vuelve al resto de la funcion original
            __builtin___clear_cache((char*)tr, (char*)(tr + 4));
            if (mprotect(tr, 4096, PROT_READ | PROT_EXEC)) return false;
            uintptr_t pg = (uintptr_t)target & ~(uintptr_t)4095;
            if (mprotect((void*)pg, 8192, PROT_READ | PROT_WRITE | PROT_EXEC)) return false;
            t[0] = 0xe51ff004;                          // ldr pc, [pc, #-4]
            t[1] = (uint32_t)(uintptr_t)hook;           // salta a hook_Add
            __builtin___clear_cache((char*)t, (char*)(t + 2));
            mprotect((void*)pg, 8192, PROT_READ | PROT_EXEC);
            *orig = (void*)tr;
            return true;
          }

          #define LOG(...) __android_log_print(ANDROID_LOG_INFO, "MenuHook", __VA_ARGS__)
          // TODO: confirmar el package en AndroidManifest.xml
          static const char* DIR_ = "/sdcard/Android/data/com.firsttouchgames.fts15/files/";
          static const float NOCH = -9999.f;  // "sin cambio"

          struct CFEPanel; struct CFEComponent; struct CFEScreen;
          struct TPointF { float x, y; };

          typedef void (*AddComponent_t)(CFEPanel*, CFEComponent*, float, float, int, bool, bool);
          typedef void (*SetPosition_t)(CFEComponent*, float, float, int, CFEPanel*);
          typedef void (*SetF_t)(CFEComponent*, float);
          typedef void (*SetScroller_t)(CFEComponent*, void*, CFEScreen*);
          typedef void (*ScrInit_t)(CFEScreen*, unsigned);
          typedef void (*ScrArea_t)(CFEScreen*, unsigned, float, float, float, float);
          typedef void (*ScrStyle_t)(CFEScreen*, unsigned, int, int, TPointF, float);
          typedef void (*ScrChar_t)(CFEScreen*, unsigned, bool, float, float, float, bool);

          static AddComponent_t orig_Add;
          static SetPosition_t SetPosition;
          static SetF_t SetW, SetH;
          static SetScroller_t SetScroller;
          static ScrInit_t ScrInit;
          static ScrArea_t ScrScrollable, ScrTouchable;
          static ScrStyle_t ScrStyle;
          static ScrChar_t ScrChar;

          struct Ov { float x, y, w, h; };
          static std::map<std::string, Ov> g_ov;
          static FILE* g_dump;

          static std::string demangle(const char* m) {
            int st = 0; char* d = abi::__cxa_demangle(m, 0, 0, &st);
            std::string s = (st == 0 && d) ? d : m; free(d); return s;
          }

          // FIX: libFTS15 NO tiene typeinfo (RTTI) de las clases CFE*, asi que vptr[-1] es basura y
          // reventaba en la 1a llamada. Ahora se identifica la clase por el simbolo de su vtable (_ZTV...),
          // que SI esta en .dynsym, resuelto con dladdr sin desreferenciar nada del objeto salvo el vptr.
          static std::string compClass(CFEComponent* c) {
            if (!c) return "null";
            void* vt = *(void**)c;
            if (!vt) return "novptr";
            Dl_info di{};
            if (dladdr(vt, &di) && di.dli_sname) {
              std::string n = demangle(di.dli_sname);       // "vtable for CFECompLabel"
              const std::string pre = "vtable for ";
              if (n.compare(0, pre.size(), pre) == 0) n = n.substr(pre.size());
              return n;
            }
            return "?";
          }

          // Clave = funcion que construye el panel (via dladdr) + indice del componente en el panel.
          // Limite conocido: dos paneles creados por la misma funcion comparten claves.
          static void hook_Add(CFEPanel* p, CFEComponent* c, float x, float y, int off, bool a, bool b) {
            if (!p || !c) { orig_Add(p, c, x, y, off, a, b); return; }  // FIX: no tocar nada si hay nulos
            int idx = *(int*)((char*)p + 300);  // this+0x12c: contador de componentes
            Dl_info di{}; dladdr(__builtin_return_address(0), &di);
            std::string key = (di.dli_sname ? demangle(di.dli_sname) : std::string("?")) + "/" + std::to_string(idx);
            if (g_dump) {
              fprintf(g_dump, "%s|%s|x=%.1f|y=%.1f|off=%d\n", key.c_str(), compClass(c).c_str(), x, y, off);
              fflush(g_dump);   // FIX: antes quedaba en buffer y un cierre dejaba dump.txt en 0 bytes
            }

            orig_Add(p, c, x, y, off, a, b);

            auto it = g_ov.find(key);
            if (it == g_ov.end()) return;
            const Ov& o = it->second;
            if (o.x != NOCH || o.y != NOCH)
              SetPosition(c, o.x != NOCH ? o.x : x, o.y != NOCH ? o.y : y, off, p);  // escribe dibujo + tactil
            if (o.w != NOCH) SetW(c, o.w);  // SetW/SetH ya tocan dibujo y tactil
            if (o.h != NOCH) SetH(c, o.h);
          }

          // Hacer deslizable un grupo de componentes. PENDIENTE: obtener el CFEScreen* dueno del panel
          // (idea: hookear CFEPanelScreen::Process y capturar 'this'). Confirmar en Ghidra:
          //  - cual de SetScrollableArea/SetTouchableArea es el contenido y cual el area visible
          //  - significado de SetStyle(int,int,TPointF,float) y SetCharacteristics(bool,f,f,f,bool)
          static void makeScrollable(CFEScreen* s, unsigned id, const float content[4], const float view[4],
                                     const std::vector<CFEComponent*>& comps) {
            // Scroller_Init solo reserva si la pantalla no tiene array (screen+0x14); si ya existe, id < screen+0x1c
            ScrInit(s, id + 1);
            ScrScrollable(s, id, content[0], content[1], content[2], content[3]);
            ScrTouchable(s, id, view[0], view[1], view[2], view[3]);
            void* scroller = *(char**)((char*)s + 0x14) + id * 0x94;  // sizeof(CFEScroller)=0x94
            for (auto* c : comps) SetScroller(c, scroller, s);
          }

          static void loadLayout() {  // linea: clave|x|y|w|h   (-9999 = sin cambio)
            std::string path = std::string(DIR_) + "layout.txt";
            FILE* f = fopen(path.c_str(), "r"); if (!f) return;
            char line[1024];
            while (fgets(line, sizeof line, f)) {
              std::vector<std::string> t; char* s = line; char* tok;
              line[strcspn(line, "\r\n")] = 0;
              while ((tok = strsep(&s, "|"))) t.push_back(tok);
              if (t.size() != 5) continue;
              g_ov[t[0]] = Ov{(float)atof(t[1].c_str()), (float)atof(t[2].c_str()),
                              (float)atof(t[3].c_str()), (float)atof(t[4].c_str())};
            }
            fclose(f); LOG("layout: %zu overrides", g_ov.size());
          }

          template <class T> static T sym(void* h, const char* n) { return (T)dlsym(h, n); }

          static void setup(void* h) {
            void* add = dlsym(h, "_ZN8CFEPanel12AddComponentEP12CFEComponentff7EOffsetbb");
            SetPosition = sym<SetPosition_t>(h, "_ZN12CFEComponent11SetPositionEff7EOffsetP8CFEPanel");
            SetW = sym<SetF_t>(h, "_ZN12CFEComponent4SetWEf");
            SetH = sym<SetF_t>(h, "_ZN12CFEComponent4SetHEf");
            SetScroller = sym<SetScroller_t>(h, "_ZN12CFEComponent11SetScrollerEP11CFEScrollerP9CFEScreen");
            ScrInit = sym<ScrInit_t>(h, "_ZN9CFEScreen13Scroller_InitEj");
            ScrScrollable = sym<ScrArea_t>(h, "_ZN9CFEScreen26Scroller_SetScrollableAreaEjffff");
            ScrTouchable = sym<ScrArea_t>(h, "_ZN9CFEScreen25Scroller_SetTouchableAreaEjffff");
            ScrStyle = sym<ScrStyle_t>(h, "_ZN9CFEScreen17Scroller_SetStyleEjii7TPointFf");
            ScrChar = sym<ScrChar_t>(h, "_ZN9CFEScreen27Scroller_SetCharacteristicsEjbfffb");
            if (!add || !SetPosition || !SetW || !SetH) { LOG("faltan simbolos"); return; }
            g_dump = fopen((std::string(DIR_) + "dump.txt").c_str(), "w");
            if (g_dump) setvbuf(g_dump, nullptr, _IOLBF, 0);
            else LOG("no se pudo abrir dump.txt");
            loadLayout();
            if (!install_hook_arm(add, (void*)hook_Add, (void**)&orig_Add)) { LOG("no se pudo instalar el hook"); return; }
            LOG("hook AddComponent instalado");
          }

          // Espera (hasta 60 s) a que libFTS15 este cargada; asi no importa en que momento se cargue menuhook.
          static void* waiter(void*) {
            for (int i = 0; i < 600; i++) {
              void* h = dlopen("libFTS15.so", RTLD_NOW | RTLD_NOLOAD);
              if (h) { setup(h); return nullptr; }
              usleep(100000);
            }
            LOG("libFTS15 nunca aparecio");
            return nullptr;
          }

          extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM*, void*) {
            pthread_t t; pthread_create(&t, nullptr, waiter, nullptr); pthread_detach(t);
            return JNI_VERSION_1_6;
          }
          MENUHOOK_CPP
          cat > patch_smali.py <<'PATCH_PY'
          #!/usr/bin/env python3
          # Uso: patch_smali.py <carpeta_apktool>
          # Anade System.loadLibrary("menuhook") justo despues de super.onCreate() en MainActivity.
          import re, sys, glob
          paths = glob.glob(sys.argv[1] + "/smali*/com/firsttouchgames/fts15/MainActivity.smali")
          if not paths: sys.exit("ERROR: no encuentro MainActivity.smali")
          p = paths[0]
          s = open(p, encoding="utf-8").read()
          if '"menuhook"' in s: print("ya parcheado"); sys.exit(0)
          m = re.search(r"\.method[^\n]* onCreate\(Landroid/os/Bundle;\)V\n.*?\n\.end method", s, re.S)
          if not m: sys.exit("ERROR: MainActivity no tiene onCreate(Bundle). Mandame ese .smali")
          body = m.group(0)
          sup = re.search(r"\n[ \t]*invoke-super \{[^}]*\}, L[^;]+;->onCreate\(Landroid/os/Bundle;\)V", body)
          if not sup: sys.exit("ERROR: no encuentro invoke-super onCreate. Mandame el .smali")
          loc = re.search(r"\.locals (\d+)", body)
          if not loc: sys.exit("ERROR: onCreate usa .registers. Mandame el .smali")
          n = int(loc.group(1))
          new = body.replace(loc.group(0), ".locals %d" % (n + 1), 1)
          ins = ('\n    const-string v%d, "menuhook"\n'
                 '    invoke-static {v%d}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V') % (n, n)
          new = new.replace(sup.group(0), sup.group(0) + ins, 1)
          open(p, "w", encoding="utf-8").write(s.replace(body, new, 1))
          print("parcheado:", p)
          PATCH_PY
          cat > equiposk23.cpp <<'EQUIPOSK23_CPP'
          // equiposk23.cpp - FASE 2: agrega equipos SOLO EN MEMORIA, leyendo equiposk23.txt. armeabi-v7a.
          // No se modifica ningun archivo del juego. Cada vez que el juego (re)carga su base de datos, se vuelven
          // a agregar los equipos del txt. Todas las lecturas de memoria son "seguras" (no crashean si hay un error).
          #include <jni.h>
          #include <dlfcn.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <deque>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <string>
          #include <vector>
          #include <android/log.h>

          #define LOG(...) __android_log_print(ANDROID_LOG_INFO, "EquiposK23", __VA_ARGS__)
          #ifndef K23_DIR
          #define K23_DIR "/sdcard/Android/data/com.firsttouchgames.fts15/files/"
          #endif
          static const char* DIR_ = K23_DIR;
          static void* (*g_alloc)(size_t) = malloc;   // (las pruebas en PC lo sustituyen)

          // Campos de CDataBase (deducidos del codigo de IsTeamIDValid / GetTeamLink / GetLeagueTeamIDs)
          static const uintptr_t O_TEAMS = 0x1c, O_LINKS = 0x20, O_PLAYERS = 0x38, O_NLINKS = 0x3c, O_NTEAMS = 0x40, O_NPLAYERS = 0x44;
          static const uintptr_t O_LGCOUNT = 0x90, O_LGLIST = 0x2fc;   // cuenta[liga] (4 bytes) y lista[liga] (512 bytes)
          static const size_t TEAM_SZ = 0x10f8, LINK_SZ = 264, PLAYER_SZ = 112, HDR = 12, LG_SZ = 512;
          static const int MAX_LG = 48;

          static int g_pipe[2] = {-1, -1};
          static FILE* g_log = nullptr;
          static uintptr_t g_myTeams = 0, g_myLinks = 0;   // arrays que fabricamos nosotros (para no repetir)

          static void k23log(const char* fmt, ...) __attribute__((format(printf, 1, 2)));
          static void k23log(const char* fmt, ...) {
            if (!g_log) { g_log = fopen((std::string(DIR_) + "equiposk23_log.txt").c_str(), "a"); if (g_log) setvbuf(g_log, nullptr, _IOLBF, 0); }
            va_list ap; va_start(ap, fmt);
            if (g_log) { vfprintf(g_log, fmt, ap); fputc('\n', g_log); }
            va_end(ap);
          }

          // Copia segura: si la direccion no es legible devuelve false en vez de crashear.
          static bool safe_copy(void* dst, uintptr_t src, size_t n) {
            if (g_pipe[0] < 0 && pipe(g_pipe) != 0) return false;
            size_t i = 0;
            while (i < n) {
              size_t c = n - i < 4096 ? n - i : 4096;
              ssize_t w = write(g_pipe[1], (const char*)(src + i), c);
              if (w <= 0) return false;
              size_t got = 0;
              while (got < (size_t)w) {
                ssize_t r = read(g_pipe[0], (char*)dst + i + got, (size_t)w - got);
                if (r <= 0) return false;
                got += (size_t)r;
              }
              i += (size_t)w;
            }
            return true;
          }
          static bool rd32(uintptr_t a, uint32_t* v) { return safe_copy(v, a, 4); }
          static void wr32(uintptr_t a, uint32_t v) { memcpy((void*)a, &v, 4); }

          static bool dump_bin(const std::string& name, uintptr_t p, size_t n) {
            FILE* f = fopen((std::string(DIR_) + name).c_str(), "wb");
            if (!f) return false;
            std::string buf(65536, 0); size_t i = 0; bool ok = true;
            while (i < n) {
              size_t c = n - i < buf.size() ? n - i : buf.size();
              if (!safe_copy(&buf[0], p + i, c)) { ok = false; break; }
              fwrite(buf.data(), 1, c, f); i += c;
            }
            fclose(f); return ok;
          }

          struct Snap { uint32_t inst, teams, links, players; int32_t nlinks, nteams, nplayers; };
          static bool snap(void** pp, Snap& s) {
            uint32_t v;
            if (!rd32((uintptr_t)pp, &v) || !v) return false;
            s.inst = v;
            if (!rd32(v + O_TEAMS, &s.teams) || !rd32(v + O_LINKS, &s.links) || !rd32(v + O_PLAYERS, &s.players)) return false;
            if (!rd32(v + O_NLINKS, (uint32_t*)&s.nlinks) || !rd32(v + O_NTEAMS, (uint32_t*)&s.nteams) ||
                !rd32(v + O_NPLAYERS, (uint32_t*)&s.nplayers)) return false;
            return s.teams && s.links && s.players && s.nteams > 0 && s.nlinks > 0 && s.nplayers > 0 &&
                   s.nteams < 5000 && s.nlinks < 5000 && s.nplayers < 1000000;
          }

          // ---------- equiposk23.txt ----------
          struct Req { uint32_t id, clone; int league; };   // league: -2 = la del clon, -1 = ninguna, >=0 = esa liga
          static std::vector<Req> read_requests() {
            std::string path = std::string(DIR_) + "equiposk23.txt";
            FILE* f = fopen(path.c_str(), "r");
            if (!f) {
              f = fopen(path.c_str(), "w");
              if (f) {
                fputs("# equiposk23.txt - equipos nuevos. Se agregan solo en memoria: no se toca ningun archivo del juego.\n"
                      "# Una linea por equipo:   id_nuevo|id_clon|liga\n"
                      "#   id_nuevo : numero de equipo libre (el nombre y el escudo salen solos si el juego los trae)\n"
                      "#   id_clon  : equipo existente del que copia plantilla, uniforme y liga (0 = Arsenal)\n"
                      "#   liga     : opcional. Vacio = entra en la liga del clon. -1 = no entra en ninguna liga.\n"
                      "# Prueba: Portsmouth (id 13) con la plantilla de Arsenal. Borra la linea para quitarlo.\n"
                      "13|0\n", f);
                fclose(f);
              }
              f = fopen(path.c_str(), "r");
              if (!f) return {};
            }
            std::vector<Req> out; char line[256];
            while (fgets(line, sizeof line, f)) {
              char* p = line; while (*p == ' ' || *p == '\t') p++;
              if (*p == '#' || *p == '\n' || *p == '\r' || !*p) continue;
              unsigned a, b; int lg = -2;
              int n = sscanf(p, "%u|%u|%d", &a, &b, &lg);
              if (n >= 2 && a < 65536 && b < 65536) out.push_back({a, b, n >= 3 ? lg : -2});
              else k23log("linea ignorada: %s", p);
            }
            fclose(f); return out;
          }

          // ---------- arrays ordenados por id (el id es el primer u32 de cada registro) ----------
          static uint32_t id_at(const std::vector<uint8_t>& v, size_t i, size_t sz) { uint32_t x; memcpy(&x, &v[i * sz], 4); return x; }
          static int find_id(const std::vector<uint8_t>& v, size_t n, size_t sz, uint32_t id) {
            for (size_t i = 0; i < n; i++) if (id_at(v, i, sz) == id) return (int)i;
            return -1;
          }
          static void insert_sorted(std::vector<uint8_t>& v, size_t& n, size_t sz, const uint8_t* rec) {
            uint32_t id; memcpy(&id, rec, 4);
            size_t pos = 0; while (pos < n && id_at(v, pos, sz) < id) pos++;
            v.insert(v.begin() + pos * sz, rec, rec + sz); n++;
          }

          // ---------- listas de equipos por liga ----------
          struct LgFind { int L = -1, w = 0, idx = -1; uint32_t cnt = 0; bool touched = false; std::vector<uint8_t> buf; };
          static bool lg_load(uintptr_t inst, int L, LgFind& r) {
            uint32_t c; if (!rd32(inst + O_LGCOUNT + 4 * L, &c) || c == 0 || c > 250) return false;
            r.buf.assign(LG_SZ, 0);
            if (!safe_copy(r.buf.data(), inst + O_LGLIST + (uintptr_t)L * LG_SZ, LG_SZ)) return false;
            r.L = L; r.cnt = c; return true;
          }
          // Detecta si los ids son de 4 o 2 bytes (los de 4 bytes deben ser todos < 2048)
          static int lg_width(const LgFind& r) {
            for (int w : {4, 2}) {
              if (r.cnt * w > LG_SZ) continue;
              bool ok = true;
              for (uint32_t i = 0; i < r.cnt && ok; i++) { uint32_t x = 0; memcpy(&x, &r.buf[i * w], w); if (x >= 2048) ok = false; }
              if (ok) return w;
            }
            return 0;
          }
          static uint32_t lg_get(const LgFind& r, uint32_t i) { uint32_t x = 0; memcpy(&x, &r.buf[i * r.w], r.w); return x; }
          static void apply_reqs(const Snap& s, const std::vector<Req>& reqs) {
            std::vector<uint8_t> T((size_t)s.nteams * TEAM_SZ), K((size_t)s.nlinks * LINK_SZ);
            if (!safe_copy(T.data(), s.teams, T.size()) || !safe_copy(K.data(), s.links, K.size())) { k23log("no pude leer las tablas"); return; }
            size_t nt = (size_t)s.nteams, nk = (size_t)s.nlinks; int added = 0;
            std::deque<LgFind> lgs;   // ligas leidas (con los cambios acumulados)
            auto lg_state = [&](int L) -> LgFind* {
              for (auto& x : lgs) if (x.L == L) return &x;
              LgFind r; if (!lg_load(s.inst, L, r)) return nullptr;
              r.w = lg_width(r); if (!r.w) return nullptr;
              lgs.push_back(r); return &lgs.back();
            };
            for (const Req& r : reqs) {
              if (find_id(T, nt, TEAM_SZ, r.id) >= 0) { k23log("equipo %u: ya existe, se omite", r.id); continue; }
              int ct = find_id(T, nt, TEAM_SZ, r.clone), ck = find_id(K, nk, LINK_SZ, r.clone);
              if (ct < 0 || ck < 0) { k23log("equipo %u: el clon %u no existe (equipo %d, plantilla %d)", r.id, r.clone, ct, ck); continue; }
              LgFind* lf = nullptr; int at = 0;
              if (r.league == -2) {
                for (int L = 0; L < MAX_LG && !lf; L++) {
                  LgFind* p = lg_state(L); if (!p) continue;
                  for (uint32_t i = 0; i < p->cnt; i++) if (lg_get(*p, i) == r.clone) { lf = p; at = (int)i + 1; break; }
                }
              } else if (r.league >= 0 && r.league < MAX_LG) { lf = lg_state(r.league); if (lf) at = (int)lf->cnt; }
              if (lf && (lf->cnt + 1) * lf->w > LG_SZ) { k23log("equipo %u: la liga %d esta llena", r.id, lf->L); lf = nullptr; }
              if (!lf && r.league != -1) k23log("equipo %u: no encontre liga (se crea sin liga)", r.id);
              std::vector<uint8_t> trec(T.begin() + ct * TEAM_SZ, T.begin() + (ct + 1) * TEAM_SZ);
              std::vector<uint8_t> krec(K.begin() + ck * LINK_SZ, K.begin() + (ck + 1) * LINK_SZ);
              memcpy(trec.data(), &r.id, 4); memcpy(krec.data(), &r.id, 4);
              insert_sorted(T, nt, TEAM_SZ, trec.data()); insert_sorted(K, nk, LINK_SZ, krec.data());
              if (lf) {   // meter el id justo despues del clon
                memmove(&lf->buf[(at + 1) * lf->w], &lf->buf[at * lf->w], (lf->cnt - at) * lf->w);
                memcpy(&lf->buf[at * lf->w], &r.id, lf->w);
                lf->cnt++; lf->touched = true;
              }
              added++;
              k23log("equipo %u: creado como copia de %u, liga %d", r.id, r.clone, lf ? lf->L : -1);
            }
            if (!added) return;
            uint8_t* nT = (uint8_t*)g_alloc(T.size()); uint8_t* nK = (uint8_t*)g_alloc(K.size());
            if (!nT || !nK) { k23log("sin memoria"); return; }
            memcpy(nT, T.data(), T.size()); memcpy(nK, K.data(), K.size());
            wr32(s.inst + O_TEAMS, (uint32_t)(uintptr_t)nT); wr32(s.inst + O_LINKS, (uint32_t)(uintptr_t)nK);
            wr32(s.inst + O_NTEAMS, (uint32_t)nt); wr32(s.inst + O_NLINKS, (uint32_t)nk);
            for (auto& o : lgs) if (o.touched) {
              memcpy((void*)(s.inst + O_LGLIST + (uintptr_t)o.L * LG_SZ), o.buf.data(), o.cnt * o.w);
              wr32(s.inst + O_LGCOUNT + 4 * o.L, o.cnt);
            }
            g_myTeams = (uintptr_t)nT; g_myLinks = (uintptr_t)nK;
            k23log("LISTO: %d equipo(s) agregado(s). Ahora hay %zu equipos y %zu plantillas.", added, nt, nk);
          }

          static void log_first_state(void** pp, const Snap& s) {
            Dl_info di{}; dladdr((void*)pp, &di);
            k23log("== base de datos cargada == libFTS15 base %p | equipos=%d plantillas=%d jugadores=%d", di.dli_fbase, s.nteams, s.nlinks, s.nplayers);
            for (int L = 0; L < MAX_LG; L++) {
              LgFind r; if (!lg_load(s.inst, L, r)) continue;
              r.w = lg_width(r);
              std::string ids; for (uint32_t i = 0; i < r.cnt && i < 6 && r.w; i++) ids += std::to_string(lg_get(r, i)) + " ";
              k23log("liga %d: %u equipos, ids de %d bytes: %s...", L, r.cnt, r.w, ids.c_str());
            }
            dump_bin("equiposk23_dbobject_big.bin", s.inst, 0x4000);
          }

          static void* worker(void*) {
            void* h = nullptr;
            for (int i = 0; i < 1200 && !h; i++) { h = dlopen("libFTS15.so", RTLD_NOW | RTLD_NOLOAD); if (!h) usleep(100000); }
            if (!h) { LOG("libFTS15 nunca aparecio"); return nullptr; }
            void** pp = (void**)dlsym(h, "_ZN9CDataBase12ms_pInstanceE");
            if (!pp) { LOG("no encuentro CDataBase::ms_pInstance"); return nullptr; }
            Snap last; memset(&last, 0, sizeof last); int stable = 0; bool first = true;
            for (;;) {
              Snap s; memset(&s, 0, sizeof s);
              if (snap(pp, s)) {
                if (memcmp(&s, &last, sizeof s) == 0) stable++; else { stable = 0; last = s; }
                if (stable == 3 && !(s.teams == g_myTeams && s.links == g_myLinks)) {   // 3 lecturas iguales = ya termino de cargar
                  if (first) { log_first_state(pp, s); first = false; }
                  std::vector<Req> reqs = read_requests();
                  k23log("-- aplicando %zu linea(s) de equiposk23.txt --", reqs.size());
                  apply_reqs(s, reqs);
                }
              } else { stable = 0; memset(&last, 0, sizeof last); }
              sleep(1);
            }
            return nullptr;
          }

          #ifndef K23_NO_JNI
          extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM*, void*) {
            pthread_t t; pthread_create(&t, nullptr, worker, nullptr); pthread_detach(t);
            return JNI_VERSION_1_6;
          }
          #endif
          EQUIPOSK23_CPP
          cat > patch_smali2.py <<'PATCH2_PY'
          #!/usr/bin/env python3
          # Uso: patch_smali2.py <carpeta_apktool>
          # Anade System.loadLibrary("equiposk23") justo despues del loadLibrary("menuhook") que puso patch_smali.py.
          import re, sys, glob
          paths = glob.glob(sys.argv[1] + "/smali*/com/firsttouchgames/fts15/MainActivity.smali")
          if not paths: sys.exit("ERROR: no encuentro MainActivity.smali")
          p = paths[0]
          s = open(p, encoding="utf-8").read()
          if '"equiposk23"' in s: print("ya parcheado"); sys.exit(0)
          m = re.search(r'const-string (v\d+), "menuhook"\n[ \t]*invoke-static \{\1\}, Ljava/lang/System;->loadLibrary\(Ljava/lang/String;\)V', s)
          if not m: sys.exit("ERROR: no encuentro el loadLibrary(menuhook). Mandame el .smali")
          reg = m.group(1)
          ins = ('\n    const-string %s, "equiposk23"\n'
                 '    invoke-static {%s}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V') % (reg, reg)
          open(p, "w", encoding="utf-8").write(s.replace(m.group(0), m.group(0) + ins, 1))
          print("parcheado:", p)
          PATCH2_PY
          cat > build_apk.sh <<'BUILD_SH'
          #!/usr/bin/env bash
          # build_apk.sh - NO PROBADO en un dispositivo. Corre en Linux / WSL / macOS.
          # Requisitos (instalar una vez):
          #   - Java, cmake, git, python3
          #   - apktool (comando "apktool" en el PATH)
          #   - Android NDK  -> export ANDROID_NDK_HOME=/ruta/al/ndk
          #   - Android build-tools (zipalign, apksigner) -> export ANDROID_BUILD_TOOLS=/ruta/build-tools/XX
          # Uso: ./build_apk.sh com_firsttouchgames_fts15.apk
          set -euo pipefail
          cd "$(dirname "$0")"
          APK_IN="${1:-com_firsttouchgames_fts15.apk}"
          : "${ANDROID_NDK_HOME:?define ANDROID_NDK_HOME}"
          : "${ANDROID_BUILD_TOOLS:?define ANDROID_BUILD_TOOLS}"
          HOST=$(ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/")
          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$HOST/bin/armv7a-linux-androideabi21-clang++"

          echo "== 1/4 Compilar libmenuhook.so"
          "$CXX" -shared -fPIC -std=c++17 -O2 menuhook.cpp -llog -static-libstdc++ -o libmenuhook.so
          "$CXX" -shared -fPIC -std=c++17 -O2 equiposk23.cpp -llog -static-libstdc++ -o libequiposk23.so

          echo "== 2/4 Descompilar APK y parchear"
          rm -rf work && apktool d -f -o work "$APK_IN"
          mkdir -p work/lib/armeabi-v7a && cp libmenuhook.so work/lib/armeabi-v7a/
          cp libequiposk23.so work/lib/armeabi-v7a/
          python3 patch_smali.py work
          python3 patch_smali2.py work

          echo "== 3/4 Reconstruir"
          apktool b work -o unsigned.apk
          "$ANDROID_BUILD_TOOLS/zipalign" -p -f 4 unsigned.apk aligned.apk

          echo "== 4/4 Firmar"
          [ -f my.keystore ] || keytool -genkeypair -keystore my.keystore -storepass android \
            -alias key -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=menuhook"
          "$ANDROID_BUILD_TOOLS/apksigner" sign --ks my.keystore --ks-pass pass:android \
            --key-pass pass:android --out FTS15_menuhook.apk aligned.apk
          echo "LISTO: FTS15_menuhook.apk (desinstala el juego original antes de instalarlo)"
          BUILD_SH
      - name: Construir y firmar
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          chmod +x build_apk.sh
          ./build_apk.sh com_firsttouchgames_fts15.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FTS15_menuhook
          path: FTS15_menuhook.apk
